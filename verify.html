<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Verify Your Identity | TrueProfile</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Verify Your Identity</h1>
    <p>Start protecting your online identity with TrueProfile.</p>
    <form id="verificationForm">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName">
        <label for="profileLink">Profile Link</label>
        <input type="url" id="profileLink">

        <button type="submit" class="submit-button">Submit Verification Request</button>
    </form>
    <p id="confirmationMessage"></p>

<script src="script.js"></script>
</body>
</html>
